description: >-
  Nx is an open-source, technology-agnostic monorepo build platform from Nrwl
  (backed by a16z) that speeds up builds and CI through computation caching, task
  orchestration, and running only the projects affected by a change. Its developer
  surface spans a local CLI (nx) with a large family of first-party @nx/* technology
  plugins and code generators, an official Model Context Protocol server (nx-mcp) and
  Nx Console editor integrations for AI-assisted development, and the hosted Nx Cloud
  service for remote caching, distributed task execution (Nx Agents), and self-healing
  CI. Nx is a build/CI tooling platform rather than a REST API provider — its integration
  surface is the nx CLI, the @nx/* npm packages, the MCP server, and Nx Cloud.
